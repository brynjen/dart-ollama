name: LlamaBindings
description: FFI bindings for llama.cpp
output: 'lib/src/bindings/llama_bindings.dart'

# When llama.cpp submodule is added, change this to:
# headers:
#   entry-points:
#     - 'llama.cpp/include/llama.h'
headers:
  entry-points:
    - 'src/llama.h'

preamble: |
  // AUTO-GENERATED FILE. DO NOT MODIFY.
  // 
  // This file was generated by ffigen from llama.h
  // To regenerate: dart run ffigen --config ffigen.yaml

functions:
  include:
    - 'llama_.*'
    - 'ggml_.*'

structs:
  include:
    - 'llama_.*'
    - 'ggml_.*'

enums:
  include:
    - 'llama_.*'
    - 'ggml_.*'

typedefs:
  include:
    - 'llama_.*'
    - 'ggml_.*'

macros:
  include:
    - 'LLAMA_.*'
    - 'GGML_.*'

comments:
  style: any
  length: full

# Silence enum warning - we handle enum sizes appropriately
silence-enum-warning: true

compiler-opts:
  - '-I/usr/include'

